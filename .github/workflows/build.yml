name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon --max-workers=2 :app:assembleMobileDebug :app:testMobileDebugUnitTest :app:assembleMobileDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: '**/build/reports/'

  binder-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: google_apis
            page-size: 4096
          - target: google_apis_ps16k
            page-size: 16384
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check configured emulator ABI
        id: abi
        run: |
          if grep -q 'include(.*x86_64' app/build.gradle.kts; then echo "supported=true" >> "$GITHUB_OUTPUT"; else echo "supported=false" >> "$GITHUB_OUTPUT"; fi
      - name: Explain unavailable emulator ABI
        if: steps.abi.outputs.supported != 'true'
        run: echo "This revision does not configure x86_64; ARM device validation remains required"
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        if: steps.abi.outputs.supported == 'true'
        with:
          api-level: 35
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "${{ matrix.page-size }}"
            ./gradlew --no-daemon --max-workers=2 :app:connectedMobileDebugAndroidTest
