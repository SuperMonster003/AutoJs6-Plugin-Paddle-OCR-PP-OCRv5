name: Icon Studio recipe
on:
  push:
    paths: [".icons/**", ".python/*icon*.py", "app/src/**/res/**", ".gitattributes", ".github/workflows/icon-studio.yml"]
  pull_request:
    paths: [".icons/**", ".python/*icon*.py", "app/src/**/res/**", ".gitattributes", ".github/workflows/icon-studio.yml"]
  workflow_dispatch:
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install Pillow==12.3.0
      - run: python .python/generate_icon_studio.py --check
